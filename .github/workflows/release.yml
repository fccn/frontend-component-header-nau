name: Release CI
on:
  push:
    branches:
    - nau/*.master

permissions:
  id-token: write
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Nodejs Env
      run: echo "NODE_VER=`cat .nvmrc`" >> $GITHUB_ENV
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VER }}
        registry-url: 'https://registry.npmjs.org'
    - name: Install dependencies
      run: npm ci
    - name: Validate package-lock.json changes
      run: make validate-no-uncommitted-package-lock-changes
    - name: Lint
      run: npm run lint
    - name: Type check
      run: npm run types
    - name: Test
      run: npm run test
    - name: i18n_extract
      run: npm run i18n_extract
    - name: Coverage
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
    - name: Build
      run: npm run build
    - name: Install npm@11
      run: npm install -g npm@11
    - name: Debug publish env
      run: |
        which npm
        npm --version
        echo "OIDC URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
        echo "OIDC URL: ${ACTIONS_ID_TOKEN_REQUEST_URL}"
        cat ~/.npmrc 2>/dev/null || echo "~/.npmrc: not found"
        cat .npmrc 2>/dev/null || echo ".npmrc: not found"
    - name: Release to npmjs
      run: npm publish
