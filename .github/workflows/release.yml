name: Release CI
on:
  push:
    branches:
    - nau/*.master

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Nodejs Env
      run: echo "NODE_VER=`cat .nvmrc`" >> $GITHUB_ENV
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VER }}
        registry-url: 'https://registry.npmjs.org'
    - name: Install dependencies
      run: npm ci
    - name: Validate package-lock.json changes
      run: make validate-no-uncommitted-package-lock-changes
    - name: Lint
      run: npm run lint
    - name: Type check
      run: npm run types
    - name: Test
      run: npm run test
    - name: i18n_extract
      run: npm run i18n_extract
    - name: Coverage
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
    - name: Build
      run: npm run build
    - name: Debug - Check OIDC subject claim
      run: |
        OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://www.npmjs.com" | jq -r '.value')
        echo "Subject: $(echo $OIDC_TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq -r '.sub')"
        echo "Workflow: $(echo $OIDC_TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq -r '.job_workflow_ref')"
    - name: Debug - Check npm config
      run: npm config list --userconfig
    - name: Release to npmjs
      run: npm publish
